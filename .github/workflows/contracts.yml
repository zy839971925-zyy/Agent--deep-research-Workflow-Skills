name: Public workflow contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package-check dependencies
        run: python -m pip install -r skills/reasoning-workflow/scripts/requirements.txt
      - name: Compile and run synthetic contracts
        run: |
          python -m compileall -q skills/reasoning-workflow/scripts
          python -m unittest discover -s tests -v
      - name: Run Portable Skill regression suite (non-mutating)
        run: python skills/reasoning-workflow/tests/run_all.py
      - name: Build and verify the Portable distribution
        run: |
          python skills/reasoning-workflow/scripts/build_distribution.py
          python skills/reasoning-workflow/tests/check_package.py --archive dist/reasoning-workflow-3.0.0.zip
          cd dist && sha256sum -c SHA256SUMS
