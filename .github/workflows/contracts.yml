name: Public workflow contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package-check dependencies
        run: python -m pip install -r skills/reasoning-workflow/scripts/requirements.txt
      - name: Compile and run synthetic contracts
        run: |
          python -m compileall -q skills/reasoning-workflow/scripts
          python -m unittest discover -s tests -v
      - name: Run Portable Skill regression suite (non-mutating)
        run: python skills/reasoning-workflow/tests/run_all.py
      - name: Test bundled provider
        run: npm --prefix integrations/deepseek-harness test
      - name: Build and verify the Portable distribution
        run: |
          release=$(python -c 'import json; print(json.load(open("skills/reasoning-workflow/RELEASE.json"))["version"])')
          archive="dist/reasoning-workflow-${release}.zip"
          python skills/reasoning-workflow/tests/check_package.py --archive "$archive"
          python skills/reasoning-workflow/scripts/build_distribution.py
          git diff --exit-code -- dist skills/reasoning-workflow/SHA256SUMS
          unpack=$(mktemp -d)
          unzip -q "$archive" -d "$unpack"
          (cd "$unpack/reasoning-workflow" && python tests/check_package.py && python tests/run_all.py)
          cd dist && sha256sum -c SHA256SUMS
