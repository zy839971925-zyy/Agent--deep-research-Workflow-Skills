interface:
  display_name: "Reasoning Workflow"
  short_description: "Default reasoning, inquiry, and work-control workflow"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Use $reasoning-workflow as the governing process for this task. First identify the real epistemic task, build a revisable model, manage premises and uncertainty, decompose/recompose only when useful, reason through consequential relationships and competing explanations, research only answer-bearing unknowns, then use durable state/change control only if persistent work requires it. Verify that the final answer or artifact still resolves the user's original objective."
